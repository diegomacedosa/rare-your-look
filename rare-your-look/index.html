<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EDE4" />
    <meta
      name="description"
      content="Rare Beauty: Rare Your Look — crie seu avatar, monte looks e complete desafios. There's no one way to be Rare."
    />
    <title>Rare Beauty: Rare Your Look</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238A5A62'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23FAF7F5'%3ER%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#scene-root">Pular para o conteúdo</a>

    <div id="app" class="app">
      <header class="app-header" role="banner">
        <button class="brand" type="button" data-nav="welcome" aria-label="Rare Your Look — voltar ao início">
          <span class="brand__rare">Rare Beauty</span>
          <span class="brand__game">Rare Your Look</span>
        </button>

        <div class="app-header__actions">
          <span class="points-pill" id="header-points" aria-live="off" title="Seus pontos">
            <span aria-hidden="true">✦</span> <span data-points>0</span> pts
          </span>
          <button class="btn btn--icon" type="button" id="btn-sound" aria-pressed="false" aria-label="Desativar som">
            <span data-icon="sound"></span>
          </button>
          <button class="btn btn--icon" type="button" id="btn-settings" aria-label="Configurações">
            <span data-icon="settings"></span>
          </button>
        </div>
      </header>

      <main id="scene-root" class="scene-root" tabindex="-1"></main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p class="noscript">Rare Your Look precisa de JavaScript ativado para funcionar.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
